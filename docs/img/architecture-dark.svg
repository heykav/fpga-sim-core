<rect x="720" y="772" width="30" height="14" fill="none" rx="7" stroke="#58a6ff" stroke-width="1.5"/>
<text x="758" y="784" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">id FIFO tracking messages in flight</text>
</svg>
