<path d="M324 562 l8 -5 v10 z" fill="#8b949e" stroke="#8b949e" stroke-width="1" stroke-linejoin="miter"/>
<line x1="944" y1="476" x2="944" y2="558" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="863.7" y="453" width="160.6" height="26" fill="#0d1117" rx="13" stroke="#58a6ff" stroke-width="1.5"/>
<text x="944" y="471" font-size="12" fill="#58a6ff" text-anchor="middle" font-weight="normal">bram_ring_ [16 ids]</text>
<line x1="640" y1="476" x2="640" y2="558" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="563.4" y="453" width="153.2" height="26" fill="#0d1117" rx="13" stroke="#58a6ff" stroke-width="1.5"/>
<text x="640" y="471" font-size="12" fill="#58a6ff" text-anchor="middle" font-weight="normal">ofi_ring_ [16 ids]</text>
<line x1="184" y1="630" x2="184" y2="666" stroke="#8b949e" stroke-width="2"/>
<path d="M184 666 l-5 -8 h10 z" fill="#8b949e" stroke="#8b949e" stroke-width="1" stroke-linejoin="miter"/>
<rect x="48" y="670" width="380" height="78" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
<text x="62" y="696" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="bold">host drain (instantaneous)</text>
<text x="62" y="720" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">consume() + clear_msix() in the same</text>
<text x="62" y="739" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">cycle as the post (no host timing)</text>
<rect x="450" y="670" width="380" height="78" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
<text x="464" y="696" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="bold">LatencyStats</text>
<text x="464" y="720" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">inclusive cycles: arrival -&gt; DMA post</text>
<text x="464" y="739" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">min / median / p99 / max, 2-cycle bins</text>
<rect x="852" y="670" width="380" height="78" fill="#161b22" rx="8" stroke="#30363d" stroke-width="1"/>
<text x="866" y="696" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="bold">VcdLogger (demo only)</text>
<text x="866" y="720" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">wire_busy() -&gt; tick_valid, last_ofi()</text>
<text x="866" y="739" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">-&gt; ofi, written to fpga_sim_core.vcd</text>
