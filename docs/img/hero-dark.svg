<text x="56" y="138" font-size="20" fill="#8b949e" text-anchor="start" font-weight="normal">cycle model of a tick-to-trade datapath</text>
<text x="56" y="164" font-size="15" fill="#8b949e" text-anchor="start" font-weight="normal">wire &gt; PCS &gt; MAC &gt; ITCH &gt; book &gt; OFI &gt; DMA</text>
<text x="56" y="196" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">min</text>
<text x="150" y="196" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="bold">14 cycles</text>
<text x="270" y="196" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">= 43.4424 ns</text>
<text x="56" y="222" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">median</text>
<text x="150" y="222" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="bold">15 cycles</text>
<text x="270" y="222" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">= 46.5455 ns</text>
<text x="56" y="248" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">p99</text>
<text x="150" y="248" font-size="18" fill="#e3b341" text-anchor="start" font-weight="bold">19 cycles</text>
<text x="270" y="248" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">= 58.9576 ns</text>
<text x="56" y="274" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">max</text>
<text x="150" y="274" font-size="18" fill="#e6edf3" text-anchor="start" font-weight="bold">20 cycles</text>
<text x="270" y="274" font-size="18" fill="#8b949e" text-anchor="start" font-weight="normal">= 62.0606 ns</text>
<text x="56" y="298" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">C++20, header-only, 322.265625 MHz clock</text>
<text x="56" y="318" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">simulated cycles, synthetic input, not a hardware measurement | 256 messages, fixed seed 0x5EEDF00D</text>
