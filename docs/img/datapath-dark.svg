<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d"><title id="t">fpga-sim-core datapath</title><desc id="d">Animated datapath diagram: one packet flows through PCS, MAC, ITCH 5.0 parser (2 cycles, fixed parameter), order book (1 cycle, fixed parameter, quote RAM latency 1), OFI (3 stages) and PCIe DMA (2 cycles, fixed parameter). Solid boxes are derived or executed by the module, dashed boxes are fixed documented model parameters. Illustrative; simulated cycles on a synthetic input, not a hardware measurement.</desc><style>.tk{transform:translateX(960.0px);opacity:1}.gl{opacity:0}@keyframes tk{0%,8%{transform:translateX(960.0px);opacity:1}11%{transform:translateX(960.0px);opacity:0}13%{transform:translateX(0);opacity:0}16.0%{transform:translateX(0);opacity:1}84.0%{transform:translateX(960.0px);opacity:1}100%{transform:translateX(960.0px);opacity:1}}.an .tk{animation:tk 10s linear infinite}@keyframes g0{0%,11.0%{opacity:0}16.0%{opacity:.35}21.0%{opacity:.35}25.0%{opacity:0}100%{opacity:0}}.an .g0{animation:g0 10s linear infinite}@keyframes g1{0%,24.6%{opacity:0}29.6%{opacity:.35}34.6%{opacity:.35}38.6%{opacity:0}100%{opacity:0}}.an .g1{animation:g1 10s linear infinite}@keyframes g2{0%,38.2%{opacity:0}43.2%{opacity:.35}48.2%{opacity:.35}52.2%{opacity:0}100%{opacity:0}}.an .g2{animation:g2 10s linear infinite}@keyframes g3{0%,51.8%{opacity:0}56.8%{opacity:.35}61.8%{opacity:.35}65.8%{opacity:0}100%{opacity:0}}.an .g3{animation:g3 10s linear infinite}@keyframes g4{0%,65.4%{opacity:0}70.4%{opacity:.35}75.4%{opacity:.35}79.4%{opacity:0}100%{opacity:0}}.an .g4{animation:g4 10s linear infinite}@keyframes g5{0%,79.0%{opacity:0}84.0%{opacity:.35}89.0%{opacity:.35}93.0%{opacity:0}100%{opacity:0}}.an .g5{animation:g5 10s linear infinite}@media (prefers-reduced-motion:reduce){.an .tk,.an .gl{animation:none}}</style><rect width="1280" height="440" fill="#090A09"/><g class="an"><rect x="24" y="24" width="1232" height="392" rx="10" fill="#111211" stroke="#2a2c29"/><circle cx="46" cy="44" r="6" fill="#ff5f57"/><circle cx="66" cy="44" r="6" fill="#e3b341"/><circle cx="86" cy="44" r="6" fill="#00FF66"/><text x="640.0" y="49" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="normal" fill="#9a9c96" text-anchor="middle">datapath.schematic  --  one message, wire to host  (illustrative)</text><line x1="24" y1="64" x2="1256" y2="64" stroke="#2a2c29"/><text x="56" y="106" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" fill="#F4F5F2" text-anchor="start">A message flows through the cycle model</text><text x="56" y="134" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="normal" fill="#9a9c96" text-anchor="start">Solid box: cycles derived from the module as it runs.  Dashed box: fixed, documented model parameter.</text><line x1="68" y1="225.0" x2="1212" y2="225.0" stroke="#2a2c29" stroke-width="2"/><rect x="76" y="150" width="168" height="150" rx="10" fill="#090A09" stroke="#00FF66" stroke-width="1.5"/><rect class="gl g0" x="76" y="150" width="168" height="150" rx="10" fill="#00FF66"/><text x="160.0" y="180" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="middle">PCS</text><text x="160.0" y="200" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">64b/66b-style blocks</text><text x="160.0" y="276" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#00FF66" text-anchor="middle">1 block / cycle</text><text x="160.0" y="328" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">7-byte payload blocks + CRC32</text><text x="160.0" y="348" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#00FF66" text-anchor="middle">derived</text><rect x="268" y="150" width="168" height="150" rx="10" fill="#090A09" stroke="#00FF66" stroke-width="1.5"/><rect class="gl g1" x="268" y="150" width="168" height="150" rx="10" fill="#00FF66"/><text x="352.0" y="180" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="middle">MAC</text><text x="352.0" y="200" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">AXI4-Stream, 512-bit</text><text x="352.0" y="276" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#00FF66" text-anchor="middle">1 beat / cycle</text><text x="352.0" y="328" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">64-byte beats, IPG checked</text><text x="352.0" y="348" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#00FF66" text-anchor="middle">derived</text><rect x="460" y="150" width="168" height="150" rx="10" fill="#090A09" stroke="#B6FF2E" stroke-width="1.5" stroke-dasharray="6 5"/><rect class="gl g2" x="460" y="150" width="168" height="150" rx="10" fill="#00FF66"/><text x="544.0" y="180" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="middle">ITCH 5.0 parse</text><text x="544.0" y="200" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">zero-copy, big-endian</text><text x="544.0" y="276" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#B6FF2E" text-anchor="middle">2 cycles</text><text x="544.0" y="328" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">A / E / X message fields</text><text x="544.0" y="348" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#B6FF2E" text-anchor="middle">fixed parameter</text><rect x="652" y="150" width="168" height="150" rx="10" fill="#090A09" stroke="#B6FF2E" stroke-width="1.5" stroke-dasharray="6 5"/><rect class="gl g3" x="652" y="150" width="168" height="150" rx="10" fill="#00FF66"/><text x="736.0" y="180" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="middle">Order book</text><text x="736.0" y="200" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">five-level, quote RAM</text><text x="736.0" y="276" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#B6FF2E" text-anchor="middle">1 cycle + RAM 1</text><text x="736.0" y="328" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">best bid / ask (price, qty)</text><text x="736.0" y="348" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#B6FF2E" text-anchor="middle">fixed parameter</text><rect x="844" y="150" width="168" height="150" rx="10" fill="#090A09" stroke="#00FF66" stroke-width="1.5"/><rect class="gl g4" x="844" y="150" width="168" height="150" rx="10" fill="#00FF66"/><text x="928.0" y="180" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="middle">OFI</text><text x="928.0" y="200" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">order-flow imbalance</text><text x="928.0" y="276" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#00FF66" text-anchor="middle">3 stages</text><text x="928.0" y="328" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">signed 32-bit e_n</text><text x="928.0" y="348" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#00FF66" text-anchor="middle">derived</text><rect x="1036" y="150" width="168" height="150" rx="10" fill="#090A09" stroke="#B6FF2E" stroke-width="1.5" stroke-dasharray="6 5"/><rect class="gl g5" x="1036" y="150" width="168" height="150" rx="10" fill="#00FF66"/><text x="1120.0" y="180" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#F4F5F2" text-anchor="middle">PCIe DMA</text><text x="1120.0" y="200" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">Gen4 x16 TLP, MSI-X</text><text x="1120.0" y="276" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#B6FF2E" text-anchor="middle">2 cycles</text><text x="1120.0" y="328" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#9a9c96" text-anchor="middle">decision record in host ring</text><text x="1120.0" y="348" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#B6FF2E" text-anchor="middle">fixed parameter</text><g class="tk"><rect x="146.0" y="211.0" width="28" height="28" rx="6" fill="#00FF66"/><rect x="146.0" y="211.0" width="28" height="28" rx="6" fill="none" stroke="#00FF66" stroke-width="1.5" opacity=".5" transform="translate(4 4)"/></g><text x="56" y="396" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#e3b341" text-anchor="start">Cycle model at 322.265625 MHz, synthetic ITCH input, simulated cycles. Not a hardware measurement.</text></g></svg>
