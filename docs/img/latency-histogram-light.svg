<text x="981.143" y="528" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">19</text>
<text x="981.143" y="550" font-size="14" fill="#57606a" text-anchor="middle" font-weight="bold">p99</text>
<rect x="1089.18" y="497.25" width="97.0743" height="1" fill="#2a78d6" rx="2"/>
<text x="1137.71" y="487.25" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">1</text>
<text x="1137.71" y="528" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">20</text>
<text x="1137.71" y="550" font-size="14" fill="#57606a" text-anchor="middle" font-weight="bold">max</text>
<text x="668" y="580" font-size="15" fill="#57606a" text-anchor="middle" font-weight="normal">latency (simulated cycles, 1 cycle = 512/165 ns)</text>
<text x="64" y="606" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">Lowest latency of each type = its PCS block count + 10, so the spread is set by message length; anything above that is waiting behind earlier messages.</text>
<text x="64" y="626" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal">source: ./fpga-sim-demo 1-cycle distribution, PRNG seed 0x5EEDF00D, 5339 cycles simulated; min/median/p99/max = 14/15/19/20 cycles</text>
</svg>
