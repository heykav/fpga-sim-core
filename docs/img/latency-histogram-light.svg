<text x="108" y="450" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">20</text>
<line x1="120" y1="390" x2="1216" y2="390" stroke="#e6eaef" stroke-width="1"/>
<text x="108" y="395" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">40</text>
<line x1="120" y1="335" x2="1216" y2="335" stroke="#e6eaef" stroke-width="1"/>
<text x="108" y="340" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">60</text>
<line x1="120" y1="280" x2="1216" y2="280" stroke="#e6eaef" stroke-width="1"/>
<text x="108" y="285" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">80</text>
<line x1="120" y1="225" x2="1216" y2="225" stroke="#e6eaef" stroke-width="1"/>
<text x="108" y="230" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">100</text>
<line x1="120" y1="170" x2="1216" y2="170" stroke="#e6eaef" stroke-width="1"/>
<text x="108" y="175" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">120</text>
<text x="108" y="152" font-size="14" fill="#57606a" text-anchor="start" font-weight="normal">messages</text>
<rect x="149.749" y="398.25" width="97.0743" height="99.75" fill="#1baf7a" rx="2"/>
<text x="198.286" y="388.25" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">37</text>
<text x="198.286" y="528" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">14</text>
<text x="198.286" y="550" font-size="14" fill="#57606a" text-anchor="middle" font-weight="bold">min</text>
<rect x="306.32" y="244.25" width="97.0743" height="253.75" fill="#eb6834" rx="2"/>
<text x="354.857" y="234.25" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">93</text>
<text x="354.857" y="528" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">15</text>
<text x="354.857" y="550" font-size="14" fill="#57606a" text-anchor="middle" font-weight="bold">median</text>
<rect x="462.891" y="203" width="97.0743" height="295" fill="#2a78d6" rx="2"/>
<rect x="462.891" y="189.25" width="97.0743" height="11.75" fill="#eb6834" rx="2"/>
<rect x="462.891" y="186.5" width="97.0743" height="1" fill="#1baf7a" rx="2"/>
<text x="511.429" y="176.5" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">114</text>
