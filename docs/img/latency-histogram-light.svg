<text x="668" y="470.75" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">7</text>
<text x="668" y="528" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">17</text>
<rect x="776.034" y="497.25" width="97.0743" height="1" fill="#2a78d6" rx="2"/>
<text x="824.571" y="487.25" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">1</text>
<text x="824.571" y="528" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="normal">18</text>
<rect x="932.606" y="491.75" width="97.0743" height="6.25" fill="#2a78d6" rx="2"/>
