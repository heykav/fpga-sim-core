<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="t">Tick-to-trade latency by message type</title>
<desc id="d">Per-message latency in simulated cycles for 256 synthetic ITCH messages, 1-cycle bins stacked by type: 14 cycles: 37; 15 cycles: 93; 16 cycles: 114; 17 cycles: 7; 18 cycles: 1; 19 cycles: 3; 20 cycles: 1. Median 15, p99 19.</desc>
<rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>
<text x="64" y="60" font-size="26" fill="#1f2328" text-anchor="start" font-weight="bold">Tick-to-trade latency, 256 synthetic ITCH messages</text>
<text x="64" y="90" font-size="16" fill="#9a6700" text-anchor="start" font-weight="normal">simulated cycles, synthetic input, not a hardware measurement</text>
<rect x="64" y="112" width="14" height="14" fill="#2a78d6" rx="3"/>
<text x="86" y="124" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">A  Add Order, 36 B = 6 PCS blocks</text>
<rect x="397.2" y="112" width="14" height="14" fill="#eb6834" rx="3"/>
<text x="419.2" y="124" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">E  Order Executed, 31 B = 5 PCS blocks</text>
<rect x="772.4" y="112" width="14" height="14" fill="#1baf7a" rx="3"/>
<text x="794.4" y="124" font-size="14" fill="#1f2328" text-anchor="start" font-weight="normal">X  Order Cancel, 23 B = 4 PCS blocks</text>
<line x1="120" y1="500" x2="1216" y2="500" stroke="#e6eaef" stroke-width="1"/>
<text x="108" y="505" font-size="14" fill="#57606a" text-anchor="end" font-weight="normal">0</text>
